<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#27272a" stroke-width="8"/>
  <g transform="translate(0 34)" stroke-linejoin="round">
    <!-- opened interior -->
    <path d="M256 106 L386 181 L256 256 L126 181 Z" fill="#18181b"/>
    <circle cx="256" cy="200" r="62" fill="url(#glow)"/>
    <circle cx="256" cy="200" r="20" fill="#ecfeff"/>
    <!-- walls -->
    <path d="M126 181 L256 256 L256 406 L126 331 Z" fill="#e4e4e7"/>
    <path d="M256 256 L386 181 L386 331 L256 406 Z" fill="#a1a1aa"/>
    <!-- lifted lid -->
    <path d="M256 30 L386 105 L256 180 L126 105 Z" fill="url(#lid)" transform="translate(0 -6)"/>
  </g>
</svg>
