<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="rea-gui-token" content="__REA_GUI_TOKEN__" />
    <title>REA Studio</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="ghost icon-button sidebar-toggle" id="sidebar-toggle" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
      <div class="brand"><img class="logo" src="/icon.svg" alt="" width="28" height="28" /> REA Studio</div>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
      <div class="target hidden" id="target"><span class="muted">Open file</span> <strong id="target-text"></strong> <button class="ghost small" id="target-close" title="Close the active target">Close</button></div>
      <div class="topbar-actions">
        <button class="ghost" id="toggle-log" title="Show REA server log">Show server log</button>
        <button class="ghost tertiary" id="restart" title="Restart the REA MCP server">Restart REA</button>
      </div>
    </header>

    <div class="banner hidden" id="banner"></div>

    <div class="layout">
      <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
      <aside class="sidebar" id="sidebar">
        <button class="nav-item home" id="nav-home"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>New analysis</span></button>
        <button class="nav-item chat-nav" id="nav-chat"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span>Chat</span></button>
        <button class="nav-item" id="nav-tools"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9l-3.8 3.8z"/></svg><span class="grow">Tool library</span><span class="tool-group-count" id="tool-count"></span></button>
        <div id="app-context"></div>
        <div class="section-label">Recent analyses</div>
        <div id="analysis-list" class="analysis-list"></div>
      </aside>

      <main id="main"></main>
    </div>

    <section class="log-panel hidden" id="log-panel">
      <div class="log-header"><span>REA server log (stderr)</span><button class="ghost small" id="close-log">Close</button></div>
      <pre id="log"></pre>
    </section>

    <dialog id="picker">
      <form method="dialog" class="picker">
        <div class="picker-header">
          <button type="button" class="ghost" id="picker-up" title="Up one folder">Up</button>
          <input id="picker-path" spellcheck="false" aria-label="Folder path" />
          <button type="button" class="ghost" id="picker-go">Open folder</button>
        </div>
        <div id="picker-items" class="picker-items"></div>
        <div class="picker-footer">
          <button value="cancel" class="ghost">Cancel</button>
          <button type="button" id="picker-select" class="primary">Choose this folder</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
